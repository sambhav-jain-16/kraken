name: Publish images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      version:
        description: 'Image tag. Defaults to git describe.'
        required: false
        type: string

concurrency:
  group: publish-images
  cancel-in-progress: false

env:
  REGISTRY: jsambhav44180

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "PACKAGE_VERSION=${INPUT_VERSION:-$(git describe --always --tags)}" >> "$GITHUB_ENV"

      - name: Build and push images
        run: make publish REGISTRY=${{ env.REGISTRY }}

      - name: Also tag and push latest
        run: |
          for component in agent build-index origin proxy testfs tracker; do
            docker tag "${REGISTRY}/kraken-${component}:${PACKAGE_VERSION}" "${REGISTRY}/kraken-${component}:latest"
            docker push "${REGISTRY}/kraken-${component}:latest"
          done
